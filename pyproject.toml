[project]
name = "artemis-pulse"
version = "0.1.0"
description = "Moteur scientifique ARTEMIS PULSE : Soleil, Terre, horizon et énergie pour un site lunaire."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "truststore>=0.10"]

[project.optional-dependencies]
spice = ["spiceypy>=6.0"]
raster = ["rasterio>=1.3"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
